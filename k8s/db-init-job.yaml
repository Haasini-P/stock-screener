# One-time schema creation. app/main.py only calls init_db() when
# APP_ENV=development (deliberately, so it's never re-run against a live
# production DB on every pod restart) — and there's no real Alembic migration
# wired up (migrations/ in the repo is unused scaffolding). Without this Job,
# a fresh Postgres has zero tables and every API call fails. Safe to re-run:
# SQLAlchemy's create_all() only creates tables that don't already exist.
#
# Run this once after postgres.yaml is up and before backend.yaml serves
# traffic: `kubectl apply -f db-init-job.yaml && kubectl wait --for=condition=complete job/stockmind-db-init -n stockmind --timeout=120s`
apiVersion: batch/v1
kind: Job
metadata:
  name: stockmind-db-init
  namespace: stockmind
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-init
          image: stockmind-backend:latest  # same image as backend.yaml — see README.md for building/pushing
          command:
            - python
            - -c
            - "import asyncio, app.main; from app.database import init_db; asyncio.run(init_db())"
          envFrom:
            - configMapRef: { name: stockmind-config }
            - secretRef: { name: stockmind-secrets }
