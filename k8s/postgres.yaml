# Same image as docker-compose.yml's postgres service (TimescaleDB-on-Postgres —
# the app only uses plain Postgres features today, but this keeps parity with
# the existing compose file in case time-series features get used later).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: stockmind
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: timescale/timescaledb:latest-pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: stockmind-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: stockmind-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: stockmind-secrets, key: POSTGRES_DB } }
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "stockmind"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "stockmind"] }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# Headless service — StatefulSet pods get stable DNS (postgres-0.postgres.stockmind…),
# and "postgres" alone (used in DATABASE_URL) resolves to the pod via this service.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: stockmind
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
