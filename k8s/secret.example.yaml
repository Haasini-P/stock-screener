# TEMPLATE ONLY — do not `kubectl apply` this file with real values, and
# never commit a copy of it that has real values filled in.
#
# Preferred: create the real Secret imperatively instead, e.g.
#
#   kubectl create secret generic stockmind-secrets -n stockmind \
#     --from-literal=POSTGRES_USER=stockmind \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=POSTGRES_DB=stockmind \
#     --from-literal=DATABASE_URL="postgresql+asyncpg://stockmind:<same password>@postgres:5432/stockmind" \
#     --from-literal=DATABASE_URL_SYNC="postgresql://stockmind:<same password>@postgres:5432/stockmind" \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=ENCRYPTION_KEY="$(python3 -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" \
#     --from-literal=UPSTOX_CLIENT_ID=... \
#     --from-literal=UPSTOX_CLIENT_SECRET=... \
#     --from-literal=UPSTOX_ANALYTICS_TOKEN=... \
#     --from-literal=KITE_API_KEY=... \
#     --from-literal=KITE_API_SECRET=...
#
# JWT_SECRET and ENCRYPTION_KEY both have hardcoded, publicly-known defaults
# in app/config.py ("change-this-to-a-random-64-char-string" /
# "change-this-to-a-fernet-key") if left unset — anyone who knows those
# defaults could forge login tokens and decrypt stored Upstox/Claude API
# credentials. Generating real values for both is not optional.
#
# If you do use a YAML file (e.g. for GitOps with sealed-secrets/SOPS),
# base64-encode each value and put it under `data:` instead of `stringData:`.
apiVersion: v1
kind: Secret
metadata:
  name: stockmind-secrets
  namespace: stockmind
type: Opaque
stringData:
  POSTGRES_USER: "stockmind"
  POSTGRES_PASSWORD: "REPLACE_ME_use_a_real_random_password"
  POSTGRES_DB: "stockmind"
  DATABASE_URL: "postgresql+asyncpg://stockmind:REPLACE_ME_use_a_real_random_password@postgres:5432/stockmind"
  DATABASE_URL_SYNC: "postgresql://stockmind:REPLACE_ME_use_a_real_random_password@postgres:5432/stockmind"
  JWT_SECRET: "REPLACE_ME_random_64_char_string"
  ENCRYPTION_KEY: "REPLACE_ME_fernet_key_see_command_above"
  UPSTOX_CLIENT_ID: ""
  UPSTOX_CLIENT_SECRET: ""
  UPSTOX_ANALYTICS_TOKEN: ""
  KITE_API_KEY: ""
  KITE_API_SECRET: ""
